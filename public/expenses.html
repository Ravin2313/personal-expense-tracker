<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Expenses - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=4.0">
    <style>
        .expense-card {
            background: rgba(17, 17, 27, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .expense-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), rgba(236, 72, 153, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .expense-card:hover::before {
            opacity: 1;
        }
        
        .expense-card:hover {
            transform: translateY(-5px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.2);
        }
        
        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .expense-category {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .category-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            position: relative;
        }
        
        .expense-amount-large {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .expense-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a1a1aa;
            font-size: 14px;
        }
        
        .detail-item i {
            color: #8b5cf6;
            width: 16px;
        }
        
        .expense-actions-new {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-action {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-edit-new {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
        }
        
        .btn-edit-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4);
        }
        
        .btn-delete-new {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-delete-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(17, 17, 27, 0.6);
            color: #a1a1aa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-tab:hover {
            border-color: rgba(139, 92, 246, 0.5);
            color: white;
        }
        
        .filter-tab.active {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border-color: #8b5cf6;
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        
        .custom-date-picker {
            display: none;
            gap: 15px;
            align-items: center;
            margin-top: 15px;
            padding: 20px;
            background: rgba(17, 17, 27, 0.6);
            border-radius: 15px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        
        .custom-date-picker.active {
            display: flex;
        }
        
        .date-input {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: rgba(17, 17, 27, 0.8);
            color: white;
            font-size: 14px;
        }
        
        .date-input:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: rgba(17, 17, 27, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        
        .summary-value {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .summary-label {
            color: #a1a1aa;
            font-size: 14px;
        }
        
        .no-expenses {
            text-align: center;
            padding: 60px 20px;
            color: #a1a1aa;
        }
        
        .no-expenses i {
            font-size: 64px;
            color: #8b5cf6;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .expense-details {
                grid-template-columns: 1fr;
            }
            
            .filter-tabs {
                justify-content: center;
            }
            
            .custom-date-picker {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <h2 class="navbar-brand mb-0">All Expenses</h2>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="expenses.html" class="nav-link active">
                            <i class="bi bi-receipt me-1"></i>Expenses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="analytics.html" class="nav-link">
                            <i class="bi bi-graph-up me-1"></i>Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="friends.html" class="nav-link">
                            <i class="bi bi-people me-1"></i>Friends
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="settings.html" class="nav-link">
                            <i class="bi bi-gear me-1"></i>Settings
                        </a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link" id="user-name">
                            <i class="bi bi-person-circle me-1"></i>
                        </span>
                    </li>
                    <li class="nav-item">
                        <button class="btn-logout" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Stats Summary -->
        <div class="stats-summary" id="stats-summary">
            <div class="summary-card">
                <div class="summary-value" style="color: #ef4444;" id="total-amount">₹0</div>
                <div class="summary-label">Total Amount</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" style="color: #8b5cf6;" id="total-count">0</div>
                <div class="summary-label">Total Expenses</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" style="color: #06b6d4;" id="avg-amount">₹0</div>
                <div class="summary-label">Average Amount</div>
            </div>
        </div>
        
        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all">
                <i class="bi bi-list-ul"></i> All Expenses
            </div>
            <div class="filter-tab" data-filter="today">
                <i class="bi bi-calendar-day"></i> Today
            </div>
            <div class="filter-tab" data-filter="week">
                <i class="bi bi-calendar-week"></i> This Week
            </div>
            <div class="filter-tab" data-filter="month">
                <i class="bi bi-calendar-month"></i> This Month
            </div>
            <div class="filter-tab" data-filter="custom">
                <i class="bi bi-calendar-range"></i> Custom Range
            </div>
        </div>
        
        <!-- Custom Date Picker -->
        <div class="custom-date-picker" id="custom-date-picker">
            <label style="color: #a1a1aa;">From:</label>
            <input type="date" class="date-input" id="date-from">
            <label style="color: #a1a1aa;">To:</label>
            <input type="date" class="date-input" id="date-to">
            <button class="btn-modern btn-primary" onclick="applyCustomFilter()">
                <i class="bi bi-search"></i> Apply
            </button>
        </div>
        
        <!-- Expenses List -->
        <div id="expenses-container">
            <div class="no-expenses">
                <i class="bi bi-receipt"></i>
                <h4>Loading expenses...</h4>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/expenses.js?v=1.0"></script>
</body>
</html>
