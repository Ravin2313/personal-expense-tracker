<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=4.0">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-key-fill"></i>
                <h2>Reset Password</h2>
                <p id="step-description">Step 1: Enter your email</p>
            </div>
            
            <!-- Step 1: Email Verification -->
            <form id="email-form" class="auth-form">
                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-envelope"></i>
                        Email Address
                    </label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="bi bi-arrow-right"></i> Continue
                </button>
            </form>

            <!-- Step 2: Security Question (Hidden initially) -->
            <form id="verification-form" class="auth-form" style="display: none;">
                <div class="alert alert-info" style="background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: #06b6d4; border-radius: 12px; padding: 15px; margin-bottom: 20px;">
                    <i class="bi bi-shield-check"></i>
                    <strong>Security Question</strong>
                    <p id="security-question-text" style="margin: 10px 0 0 0; font-size: 15px; font-weight: 600;"></p>
                </div>

                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-question-circle"></i>
                        Your Answer
                    </label>
                    <input type="text" id="security-answer" placeholder="Enter your answer" required>
                    <small>Answer is case-insensitive</small>
                </div>

                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-key"></i>
                        New Password
                    </label>
                    <input type="password" id="new-password" placeholder="Enter new password" minlength="6" required>
                    <small>Minimum 6 characters</small>
                </div>

                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-key-fill"></i>
                        Confirm Password
                    </label>
                    <input type="password" id="confirm-password" placeholder="Confirm new password" minlength="6" required>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="bi bi-check-circle"></i> Reset Password
                </button>
                
                <button type="button" class="btn-auth" style="background: linear-gradient(135deg, #6b7280, #4b5563); margin-top: 10px;" onclick="resetForm()">
                    <i class="bi bi-arrow-left"></i> Back
                </button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="index.html">Login</a></p>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api' 
            : `${window.location.origin}/api`;

        let userId = null;

        // Create particles
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            if (!particlesContainer) return;
            
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                
                const colors = [
                    'rgba(139, 92, 246, 0.6)',
                    'rgba(236, 72, 153, 0.6)',
                    'rgba(6, 182, 212, 0.6)'
                ];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Step 1: Email verification
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = e.target.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Verifying...';

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password/get-question`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok) {
                    // Store userId for step 2
                    userId = data.userId;
                    
                    // Show verification form
                    document.getElementById('email-form').style.display = 'none';
                    document.getElementById('verification-form').style.display = 'block';
                    document.getElementById('step-description').textContent = 'Step 2: Answer security question';
                    document.getElementById('security-question-text').textContent = data.securityQuestion;
                    
                    showNotification('Please answer your security question', 'info');
                } else {
                    showNotification(data.message || 'Verification failed', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-arrow-right"></i> Continue';
                }
            } catch (err) {
                console.error('Error:', err);
                showNotification('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-arrow-right"></i> Continue';
            }
        });

        // Step 2: Password reset with security answer
        document.getElementById('verification-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const securityAnswer = document.getElementById('security-answer').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Validation
            if (newPassword !== confirmPassword) {
                showNotification('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }

            if (securityAnswer.length < 2) {
                showNotification('Please provide a valid answer', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Resetting...';

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password/reset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        userId,
                        securityAnswer,
                        newPassword 
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showNotification(data.message, 'success');
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showNotification(data.message || 'Failed to reset password', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';
                }
            } catch (err) {
                console.error('Error:', err);
                showNotification('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Reset Password';
            }
        });

        // Reset form to step 1
        function resetForm() {
            document.getElementById('email-form').style.display = 'block';
            document.getElementById('verification-form').style.display = 'none';
            document.getElementById('step-description').textContent = 'Step 1: Enter your email';
            document.getElementById('verification-form').reset();
            userId = null;
        }

        // Show Notification
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            
            const notification = document.createElement('div');
            notification.className = `notification-toast notification-${type}`;
            
            const icon = type === 'success' ? 'check-circle-fill' : 
                         type === 'error' ? 'x-circle-fill' : 'info-circle-fill';
            
            notification.innerHTML = `
                <i class="bi bi-${icon}"></i>
                <span>${message}</span>
                <button class="notification-close" onclick="this.parentElement.remove()">
                    <i class="bi bi-x"></i>
                </button>
            `;
            
            container.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 10);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }
    </script>
</body>
</html>
