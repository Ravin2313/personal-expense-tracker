<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css?v=4.0">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-shield-lock-fill"></i>
                <h2>Setup Admin Account</h2>
                <p>Create the first admin user for your system</p>
            </div>
            
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i>
                <strong>One-time Setup:</strong> This page is only for creating the first admin. After that, use the admin panel to manage users.
            </div>
            
            <form id="setup-admin-form" class="auth-form">
                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-envelope"></i>
                        Admin Email
                    </label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>

                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-key"></i>
                        Admin Password
                    </label>
                    <input type="password" id="password" placeholder="Enter password" minlength="6" required>
                    <small>Minimum 6 characters</small>
                </div>

                <div class="form-group-modern">
                    <label>
                        <i class="bi bi-shield-check"></i>
                        Secret Setup Key
                    </label>
                    <input type="password" id="secret-key" placeholder="Enter ADMIN_SETUP_KEY from .env" required>
                    <small>Get this from your .env file (ADMIN_SETUP_KEY)</small>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="bi bi-check-circle"></i> Create Admin
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="index.html">Login</a></p>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api' 
            : `${window.location.origin}/api`;

        // Create particles
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            if (!particlesContainer) return;
            
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                
                const colors = [
                    'rgba(139, 92, 246, 0.6)',
                    'rgba(236, 72, 153, 0.6)',
                    'rgba(6, 182, 212, 0.6)'
                ];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // Handle form submission
        document.getElementById('setup-admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const secretKey = document.getElementById('secret-key').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            if (password.length < 6) {
                showNotification('Password must be at least 6 characters', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Creating...';

            try {
                const res = await fetch(`${API_URL}/admin/setup-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password, secretKey })
                });

                const data = await res.json();

                if (res.ok) {
                    showNotification(data.message, 'success');
                    document.getElementById('setup-admin-form').reset();
                    
                    // Show success info
                    setTimeout(() => {
                        alert(`Admin created successfully!\n\nEmail: ${data.email}\n\nYou can now login and access admin panel at /admin.html`);
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showNotification(data.message || 'Failed to create admin', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Create Admin';
                }
            } catch (err) {
                console.error('Error:', err);
                showNotification('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle"></i> Create Admin';
            }
        });

        // Show Notification
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            
            const notification = document.createElement('div');
            notification.className = `notification-toast notification-${type}`;
            
            const icon = type === 'success' ? 'check-circle-fill' : 
                         type === 'error' ? 'x-circle-fill' : 'info-circle-fill';
            
            notification.innerHTML = `
                <i class="bi bi-${icon}"></i>
                <span>${message}</span>
                <button class="notification-close" onclick="this.parentElement.remove()">
                    <i class="bi bi-x"></i>
                </button>
            `;
            
            container.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 10);
            
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }
    </script>
</body>
</html>
